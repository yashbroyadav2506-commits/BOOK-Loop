{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <span class="brand-icon-wrap mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                        <i class="bi bi-chat-dots-fill"></i>
                    </span>
                    <h2 class="fw-bold text-primary-navy">Contact & Support</h2>
                    <p class="text-muted small">Have feedback, suggestions, or need help with a book listing?</p>
                </div>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="name" class="form-label small fw-bold text-muted">Your Name</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" value="{{ current_user.full_name if current_user.is_authenticated else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-bold text-muted">College Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="name@stvincentngp.edu.in" value="{{ current_user.college_email if current_user.is_authenticated else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="subject" class="form-label small fw-bold text-muted">Subject / Department</label>
                        <input type="text" id="subject" name="subject" class="form-control" placeholder="e.g. Question regarding book return" required>
                    </div>

                    <div class="mb-4">
                        <label for="message" class="form-label small fw-bold text-muted">Your Message</label>
                        <textarea id="message" name="message" class="form-control" rows="4" placeholder="How can our student team assist you?" required></textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-teal py-2">
                            <i class="bi bi-send me-1"></i> Send Support Message
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top small text-muted">
                    <i class="bi bi-geo-alt me-1"></i> St. Vincent Pallotti College of Engineering & Technology, Gavsi Manapur, Wardha Road, Nagpur, Maharashtra 441108
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
